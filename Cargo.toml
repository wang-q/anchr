[package]
name = "anchr"
version = "0.3.18"
authors = ["wang-q <wang-q@outlook.com>"]
edition = "2021"
description = "Assembler of N-free CHRomosomes"
documentation = "https://github.com/wang-q/anchr"
readme = "README.md"
homepage = "https://github.com/wang-q/anchr"
repository = "https://github.com/wang-q/anchr"
license = "MIT"
categories = ["command-line-utilities", "science"]
publish = false

[[bin]]
name = "anchr"
path = "src/anchr.rs"

[dependencies]
clap = { version = "4.5.28", features = ["cargo"] }
anyhow = "1.0.93"
regex = "1.11.1"
lazy_static = "1.5.0"
itertools = "0.14.0"
flate2 = "1.1.8"
# Pinned to the pgr commit used during migration (phase 1 libs pub-ification).
# Local development overrides this via .cargo/config.toml -> ../pgr.
# Bump deliberately after pgr API changes that anchr needs.
pgr = { git = "https://github.com/wang-q/pgr", rev = "aaa5d75f675b3e9b932c71d8701bfbf8743f6d38" }

tera = "1.20.0"
# data structure
# petgraph matches pgr's 0.7.1. rustworkx-core was dropped: merge.rs used it
# only for connected_components, now implemented locally as `weak_components`.
petgraph = "0.7.1"
layout-rs = "0.1.2"
indexmap = "2.13.0"

which = "7.0.0"
tempfile = "3.14.0"
cmd_lib = "1.9.6"
path-clean = "1.0.1"

[build-dependencies]

[dev-dependencies]
assert_cmd = "2.0.14"
predicates = "3.1.0"
criterion = "0.5.1"
rand = "0.9"

[[bench]]
name = "covered_benchmark"
harness = false

[profile.release]
lto = true
